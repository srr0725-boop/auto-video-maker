<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GK Auto Video Maker</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font-family:Arial,sans-serif;padding:18px}
.card{max-width:620px;margin:auto;background:#fff;border-radius:18px;padding:22px;box-shadow:0 8px 28px #0002}
h1{margin:0 0 8px;text-align:center}p{color:#555;line-height:1.5}
label{font-weight:700;display:block;margin:16px 0 7px}
input,textarea,button{width:100%;font-size:16px;padding:13px;border-radius:11px;border:1px solid #ccc}
textarea{min-height:130px}
button{margin-top:18px;background:#111;color:#fff;font-weight:700;border:0}
#status{text-align:center;margin-top:15px;font-weight:700}
a{display:block;margin-top:14px;text-align:center}
</style>
</head>
<body>
<div class="card">
<h1>🎬 GK Auto Video Maker</h1>
<p>बस <b>Image + Script</b> डालें। बाकी 15 सेकंड का vertical GK video अपने-आप बनेगा, और OpenAI API key लगी होने पर AI voice भी अपने-आप जुड़ जाएगी।</p>
<form id="f">
<label>1. Image</label>
<input type="file" name="image" accept="image/*" required>
<label>2. Script / Question</label>
<textarea name="script" placeholder="अपना पूरा सवाल या script यहाँ लिखें..." required></textarea>
<button>🎬 Generate 15 Sec Video</button>
</form>
<div id="status"></div>
</div>
<script>
f.addEventListener('submit', async e=>{
 e.preventDefault(); status.textContent="⏳ Video बन रहा है... कृपया इंतजार करें।";
 try{
  const r=await fetch('/generate',{method:'POST',body:new FormData(f)});
  const j=await r.json();
  if(!r.ok) throw new Error(j.error||'Video नहीं बना');
  status.innerHTML='✅ Video तैयार है! <a href="'+j.download+'">⬇️ MP4 Download करें</a>';
 }catch(err){status.textContent='❌ '+err.message}
});
</script>
</body>
</html>
